<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Miraculous do Dragão - Beast</title>
  <style>
    body {
      background: linear-gradient(to bottom right, #222, #444);
      color: white;
      font-family: sans-serif;
      text-align: center;
      padding: 2rem;
    }
    button {
      padding: 1rem 2rem;
      margin: 1rem;
      font-size: 1rem;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }
    .raio { background-color: #ffd700; }
    .agua { background-color: #00bfff; }
    .ar { background-color: #ccc; color: #000; }
  </style>
</head>
<body>
  <h1>Miraculous do Dragão - Beast</h1>
  <p id="status">Pronto para usar um poder.</p>
  <button class="raio" onclick="usarPoder('Raio')">Usar Raio</button>
  <button class="agua" onclick="usarPoder('Água')">Usar Água</button>
  <button class="ar" onclick="usarPoder('Ar')">Usar Ar</button>

  <script>
    const ME = 'Beast'; // Nome do personagem
    const PARTICIPANTES = ['Beast', 'Yellowfer', 'Hell Cat', 'Lindemberg', 'Psique', 'Abrax', 'Litlegot'];

    const DURACOES = {
      'Raio': 60 * 60 * 1000,     // 1h
      'Água': 30 * 60 * 1000,     // 30min
      'Ar': 15 * 60 * 1000        // 15min
    };

    const channel = new BroadcastChannel('miraculous');

    function obterEfeitos() {
      return JSON.parse(localStorage.getItem('efeitos') || '{}');
    }

    function salvarEfeitos(efeitos) {
      localStorage.setItem('efeitos', JSON.stringify(efeitos));
    }

    function adicionarEfeito(dest, elemento, duracao) {
      const efeitos = obterEfeitos();
      if (!efeitos[dest]) efeitos[dest] = {};
      efeitos[dest][elemento] = Date.now() + duracao;
      salvarEfeitos(efeitos);
    }

    function estaBloqueado(nome) {
      const efeitos = obterEfeitos()[nome];
      if (!efeitos) return false;
      return ['Raio', 'Água', 'Ar'].some(el => efeitos[el] && efeitos[el] > Date.now());
    }

    function usarPoder(elemento) {
      if (estaBloqueado(ME)) {
        alert('⚠️ Você está bloqueado e não pode usar poderes.');
        return;
      }

      let dest = prompt(`Usar poder de ${elemento} em quem?\n${PARTICIPANTES.filter(p => p !== ME).join(', ')}`);
      if (!PARTICIPANTES.includes(dest) || dest === ME) return alert('Destino inválido.');

      const efeitos = obterEfeitos();
      const atingidos = JSON.parse(localStorage.getItem('atingidos') || '[]');

      if (atingidos.includes(dest)) {
        alert('⚠️ Você já atingiu esse alvo. Aguarde o reset da Cobra.');
        return;
      }

      if (efeitos[dest] && efeitos[dest][elemento] && efeitos[dest][elemento] > Date.now()) {
        alert(`⚠️ ${dest} já está sob efeito de ${elemento}.`);
        return;
      }

      adicionarEfeito(dest, elemento, DURACOES[elemento]);
      atingidos.push(dest);
      localStorage.setItem('atingidos', JSON.stringify(atingidos));

      channel.postMessage({
        type: 'poder',
        data: { from: ME, to: dest, elemento }
      });

      alert(`✅ Você aplicou ${elemento} em ${dest} com sucesso!`);
    }

    function atualizarStatus() {
      const efeitos = obterEfeitos()[ME];
      const status = document.getElementById('status');
      if (!efeitos) {
        status.textContent = 'Pronto para usar um poder.';
        return;
      }

      const ativos = Object.entries(efeitos)
        .filter(([_, t]) => t > Date.now())
        .map(([el, t]) => `${el} (${Math.ceil((t - Date.now()) / 60000)} min)`);

      status.textContent = ativos.length
        ? `Você está sob efeito: ${ativos.join(', ')}`
        : 'Pronto para usar um poder.';
    }

    setInterval(atualizarStatus, 10000);
    atualizarStatus();

    channel.onmessage = (event) => {
      const { type, data } = event.data;
      if (type === 'poder' && data.to === ME) {
        const { from, elemento } = data;
        alert(`⚡ Você foi atingido por ${from} com o poder de ${elemento}!`);
        adicionarEfeito(ME, elemento, DURACOES[elemento]);
        atualizarStatus();
      }
    };
  </script>
</body>
</html>
